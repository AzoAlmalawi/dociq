<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocIQ - Clinical Documentation Intelligence & EHR Workstation</title>
  
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>

    // ==============================================================
    // BULLETPROOF ROUTER & STATE SYNCHRONIZATION ENGINE
    // ==============================================================
    window.appScoreState = {
      quality: 68,
      research: 72,
      labAccepted: false,
      acoAccepted: false,
      stewardshipAccepted: false
    };

    window.setStep = function(step) {
      window.navigateTo(step);
    };
    window.setActiveTab = window.setStep;

    window.navigateTo = function(step) {
      const target = Math.min(Math.max(Number(step) || 1, 1), 7);
      currentStep = target;

      for (let s = 1; s <= 7; s++) {
        const screenEl = document.getElementById('screen-' + s);
        if (screenEl) {
          if (s === target) {
            screenEl.style.display = 'block';
            screenEl.classList.remove('hidden');
          } else {
            screenEl.style.display = 'none';
            screenEl.classList.add('hidden');
          }
        }

        const sideBtn = document.getElementById('stepBtn-' + s);
        if (sideBtn) {
          const isActive = (s === target);
          sideBtn.className = isActive
            ? 'w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-left transition-all cursor-pointer bg-teal-50 text-teal-800 border border-teal-200 font-bold shadow-soft'
            : 'w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-left transition-all cursor-pointer text-slate-600 hover:bg-slate-50 hover:text-slate-900 border border-transparent';
        }
      }

      if (target === 6) {
        window.updateGlobalScores();
      }

      if (target === 7 && typeof updateFinalRecordDisplay === 'function') {
        updateFinalRecordDisplay();
      }

      const mainEl = document.querySelector('main');
      if (mainEl) mainEl.scrollTop = 0;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    function navigateTo(step) {
      window.navigateTo(step);
    }

    window.updateGlobalScores = function() {
      let q = 68;
      let r = 72;

      if (window.appScoreState.labAccepted) {
        q += 10; // 78
        r += 8;  // 80
      }
      if (window.appScoreState.acoAccepted) {
        q += 8;  // 86
        r += 5;  // 85
      }
      if (window.appScoreState.stewardshipAccepted) {
        q += 6;  // 92
        r += 4;  // 89
      }

      q = Math.min(Math.max(q, 0), 100);
      r = Math.min(Math.max(r, 0), 100);

      window.appScoreState.quality = q;
      window.appScoreState.research = r;

      // 1. Update Step 1 Sarah Al-Otaibi Patient Card
      const sCardQ = document.getElementById('sarahCardQualityScore');
      if (sCardQ) sCardQ.innerText = Math.round(q) + '%';
      const sCardR = document.getElementById('sarahCardResearchScore');
      if (sCardR) sCardR.innerText = Math.round(r) + '%';

      // 2. Update Step 3 Dynamic Gauge
      if (typeof updateQualityGauge === 'function') {
        updateQualityGauge(q);
      }

      // 3. Step 6 Left Card Header: Documentation Quality Badge (Dynamic)
      const qBadge = document.getElementById('step6QualityBadge');
      if (qBadge) {
        if (q < 75) {
          qBadge.innerText = `${Math.round(q)}% - Action Required`;
          qBadge.className = 'text-xs font-semibold px-2.5 py-1 bg-amber-500/20 text-amber-300 border border-amber-500/30 rounded-full transition-all';
        } else if (q >= 75 && q < 90) {
          qBadge.innerText = `${Math.round(q)}% - In Review`;
          qBadge.className = 'text-xs font-semibold px-2.5 py-1 bg-teal-500/20 text-teal-300 border border-teal-500/30 rounded-full transition-all';
        } else {
          qBadge.innerText = `${Math.round(q)}% - Excellent`;
          qBadge.className = 'text-xs font-semibold px-2.5 py-1 bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 rounded-full transition-all';
        }
      }

      // 4. Step 6 Right Card Header: Research Readiness Badge (Dynamic)
      const rBadge = document.getElementById('step6ResearchBadge');
      if (rBadge) {
        if (r < 80) {
          rBadge.innerText = `${Math.round(r)}% - Moderate`;
          rBadge.className = 'text-xs font-semibold px-2.5 py-1 bg-amber-500/20 text-amber-300 border border-amber-500/30 rounded-full transition-all';
        } else {
          rBadge.innerText = `${Math.round(r)}% - Very Good`;
          rBadge.className = 'text-xs font-semibold px-2.5 py-1 bg-emerald-400/20 text-emerald-300 border border-emerald-400/30 rounded-full transition-all';
        }
      }
    };

    let currentStep = 1;
    let isLabAccepted = false;
    let isAcoAccepted = false;
    let isPlanAccepted = false;
    let isRecordSigned = false;

    // ==============================================================
    // CLINICAL DATA MODIFICATIONS AUDIT LOG SYSTEM (NO ROUTING LOGS)
    // ==============================================================
    const defaultAuditLogs = [
      {
        id: 'evt-1',
        category: 'EHR Ingest',
        title: 'Initial EHR Demographic Ingestion',
        actor: 'Cerner / Epic Bridge',
        timestamp: '2026-08-27 18:40:12',
        payload: 'Sarah Al-Otaibi baseline inpatient profile loaded (MRN: 882934, Room 402-B).'
      },
      {
        id: 'evt-2',
        category: 'EHR Ingest',
        title: 'LIS Lab Ingestion',
        actor: 'LOINC Bridge',
        timestamp: '2026-08-27 18:42:05',
        payload: 'Ingested LOINC-mapped labs (WBC 8.2 x10^9/L, CRP 6.5 mg/L, Procalcitonin 0.11 ng/mL).'
      }
    ];

    let auditLogs = [...defaultAuditLogs];

    function appendClinicalAuditLog(category, title, actor, payload) {
      const now = new Date();
      const timeStr = now.getFullYear() + '-' +
        String(now.getMonth()+1).padStart(2, '0') + '-' +
        String(now.getDate()).padStart(2, '0') + ' ' +
        String(now.getHours()).padStart(2, '0') + ':' +
        String(now.getMinutes()).padStart(2, '0') + ':' +
        String(now.getSeconds()).padStart(2, '0');

      const entry = {
        id: 'evt-' + Date.now() + '-' + Math.floor(Math.random()*1000),
        category,
        title,
        actor,
        timestamp: timeStr,
        payload
      };

      auditLogs.unshift(entry); // Prepend: newest modification at top
      renderAuditLogs();

      const counterBadge = document.getElementById('auditEventCounter');
      if (counterBadge) counterBadge.innerText = `${auditLogs.length} Clinical Events`;
      const headerCount = document.getElementById('auditHeaderCountBadge');
      if (headerCount) headerCount.innerText = `${auditLogs.length}`;
    }

    function renderAuditLogs() {
      const container = document.getElementById('auditLogsContainer');
      if (!container) return;

      const categoryStyles = {
        'Clinician Modification': { badge: 'badge-emerald', icon: '🩺' },
        'Clinician Override': { badge: 'badge-amber', icon: '⚠️' },
        'EHR Ingest': { badge: 'badge-teal', icon: '🧪' },
        'Diagnostic Refinement': { badge: 'badge-blue', icon: '🏷️' },
        'Clinical Guideline Action': { badge: 'badge-amber', icon: '💊' },
        'Security': { badge: 'badge-purple', icon: '🔒' }
      };

      container.innerHTML = auditLogs.map(item => {
        const style = categoryStyles[item.category] || { badge: 'badge-teal', icon: '📋' };
        return `
          <div class="card-hospital p-4 space-y-2 fade-in hover:border-slate-300 transition-all">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div class="flex items-center gap-2">
                <span class="px-2 py-0.5 rounded text-[10px] font-bold ${style.badge} flex items-center gap-1">
                  <span>${style.icon}</span>
                  <span>${item.category}</span>
                </span>
                <span class="font-bold text-xs text-slate-900">${item.title}</span>
              </div>
              <div class="text-[11px] font-mono text-slate-400 font-semibold">${item.timestamp}</div>
            </div>
            <p class="text-xs text-slate-700 leading-relaxed font-medium">${item.payload}</p>
            <div class="text-[10px] text-slate-400 pt-1 border-t border-slate-100 flex items-center justify-between">
              <span>Actor: <strong class="text-slate-700">${item.actor}</strong></span>
              <span class="font-mono text-[9px]">ID: ${item.id}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function downloadAuditLogJson() {
      const blob = new Blob([JSON.stringify(auditLogs, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'audit_trail_sarah_alotaibi.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showToast('Audit Log Exported', 'audit_trail_sarah_alotaibi.json downloaded to your machine.', 'success');
    }

    function clearTransientLogs() {
      auditLogs = [...defaultAuditLogs];
      renderAuditLogs();
      const counterBadge = document.getElementById('auditEventCounter');
      if (counterBadge) counterBadge.innerText = `${auditLogs.length} Clinical Events`;
      const headerCount = document.getElementById('auditHeaderCountBadge');
      if (headerCount) headerCount.innerText = `${auditLogs.length}`;
      showToast('Audit Log Reset', 'Reset to initial baseline clinical events.', 'info');
    }

    function openFhirModal() {
      const bundle = generateFhirR4Bundle();
      const pre = document.getElementById('fhirPreBlock');
      if (pre) {
        pre.innerText = JSON.stringify(bundle, null, 2);
      }
      openModal('fhirModal');
    }

    function copyFhirJson() {
      const pre = document.getElementById('fhirPreBlock');
      const text = pre ? pre.innerText : '';
      navigator.clipboard.writeText(text).then(() => {
        const btnText = document.getElementById('copyBtnText');
        if (btnText) {
          btnText.innerText = 'Copied ✓';
          setTimeout(() => btnText.innerText = 'Copy JSON', 2000);
        }
        showToast('FHIR Copied', 'HL7 FHIR R4 Bundle copied to clipboard.', 'success');
      });
    }

    function downloadFhir() {
      const bundle = generateFhirR4Bundle();
      const blob = new Blob([JSON.stringify(bundle, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'fhir_r4_sarah_alotaibi.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      showToast('FHIR Downloaded', 'fhir_r4_sarah_alotaibi.json downloaded to your device.', 'success');
    }

    function navigateTo(step) {
      currentStep = step;
      for (let s = 1; s <= 7; s++) {
        const screenEl = document.getElementById('screen-' + s);
        if (screenEl) {
          screenEl.classList.toggle('hidden', s !== step);
        }
        const btnEl = document.getElementById('stepBtn-' + s);
        if (btnEl) {
          const isActive = (s === step);
          btnEl.className = isActive
            ? 'w-full p-2.5 rounded-xl flex items-center justify-between text-left transition-all cursor-pointer bg-teal-50 text-teal-800 border border-teal-200 font-bold shadow-soft'
            : 'w-full p-2.5 rounded-xl flex items-center justify-between text-left transition-all cursor-pointer text-slate-600 hover:bg-slate-50 hover:text-slate-900 border border-transparent';
        }
      }

      if (step === 7) {
        updateFinalRecordDisplay();
      }

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function filterQueue(dept) {
      ['All', 'Internal Medicine', 'Cardiology', 'Surgery'].forEach(d => {
        const btn = document.getElementById('filterBtn-' + d);
        if (btn) {
          btn.className = d === dept
            ? 'px-3 py-1.5 rounded-lg text-xs font-bold bg-teal-700 text-white shadow-soft transition-all'
            : 'px-3 py-1.5 rounded-lg text-xs font-bold text-slate-600 hover:text-slate-900 transition-all';
        }
      });

      document.querySelectorAll('.patient-card').forEach(card => {
        const cardDept = card.getAttribute('data-dept');
        card.style.display = (dept === 'All' || cardDept === dept) ? 'flex' : 'none';
      });
    }

    function handleSearch(query) {
      const q = query.toLowerCase();
      document.querySelectorAll('.patient-card').forEach(card => {
        const name = (card.getAttribute('data-name') || '').toLowerCase();
        const mrn = (card.getAttribute('data-mrn') || '').toLowerCase();
        const dept = (card.getAttribute('data-dept') || '').toLowerCase();
        const match = name.includes(q) || mrn.includes(q) || dept.includes(q);
        card.style.display = match ? 'flex' : 'none';
      });
    }

    function acceptLabIngestion() {
      isLabAccepted = true;
      const objEl = document.getElementById('objectiveTextarea');
      const labSnippet = "\\n\\n[Cerner LIS Biomarkers Aug 18]: WBC 8.2 x10^9/L (from 14.1), CRP 6.5 mg/L (from 45.0), Procalcitonin 0.11 ng/mL.";
      if (!objEl.value.includes('WBC 8.2')) {
        objEl.value += labSnippet;
      }
      objEl.classList.add('highlight-insert');
      setTimeout(() => objEl.classList.remove('highlight-insert'), 1800);

      const beforeBadge = document.getElementById('objBeforeBadge');
      if (beforeBadge) beforeBadge.classList.add('hidden');
      const afterBadge = document.getElementById('objAfterBadge');
      if (afterBadge) {
        afterBadge.classList.remove('hidden');
        afterBadge.classList.add('flex');
      }

      document.getElementById('objectiveStatusBadge').innerText = 'LOINC MAPPED';
      document.getElementById('objectiveStatusBadge').className = 'text-[10px] font-bold badge-emerald px-2 py-0.5 rounded';
      document.getElementById('objKineticsText').innerText = 'Biomarker Kinetics Documented';
      document.getElementById('objKineticsText').className = 'text-emerald-700 font-semibold';

      appendClinicalAuditLog(
        'EHR Ingest',
        'LIS Biomarker Ingestion',
        'LOINC / Cerner LIS',
        'Ingested LOINC-mapped labs (WBC 8.2 x10^9/L, CRP 6.5 mg/L, Procalcitonin 0.11 ng/mL).'
      );

      handleDoctorInput();
      showToast('Cerner LIS Injected (+10%)', 'WBC 8.2 & CRP 6.5 added to Objective. Score raised to 78%!', 'success');
    }

    function acceptAcoSpecificity() {
      isAcoAccepted = true;
      const assessEl = document.getElementById('assessmentTextarea');
      assessEl.value = `1. Community-Acquired Pneumonia (CAP) - Resolving (ICD-10 J18.9).\\n2. Asthma-COPD Overlap (ACO) - ICD-10 J44.9 / J45.30.\\n3. Essential Hypertension - Blood pressure controlled.`;
      assessEl.classList.add('highlight-insert');
      setTimeout(() => assessEl.classList.remove('highlight-insert'), 1800);

      const beforeBadge = document.getElementById('assessBeforeBadge');
      if (beforeBadge) beforeBadge.classList.add('hidden');
      const afterBadge = document.getElementById('assessAfterBadge');
      if (afterBadge) {
        afterBadge.classList.remove('hidden');
        afterBadge.classList.add('flex');
      }

      document.getElementById('assessmentStatusBadge').innerText = 'ACO SPECIFIED (J44.9/J45.30)';
      document.getElementById('assessmentStatusBadge').className = 'text-[10px] font-bold badge-emerald px-2 py-0.5 rounded';
      document.getElementById('assessIcdText').innerText = 'ICD-10 Specificity Mapped';
      document.getElementById('assessIcdText').className = 'text-emerald-700 font-semibold';

      appendClinicalAuditLog(
        'Diagnostic Refinement',
        'Comorbidity Coding Specificity',
        'Dr. Mohammed',
        'Upgraded comorbidity to Asthma-COPD Overlap (ACO) ICD-10 J44.9/J45.30.'
      );

      handleDoctorInput();
      showToast('ACO Specificity Added (+8%)', 'Assessment upgraded with J44.9 code. Score raised to 86%!', 'success');
    }

    function acceptStewardshipPlan() {
      isPlanAccepted = true;
      const planEl = document.getElementById('planTextarea');
      planEl.value = `- Step-down to Oral Amox/Clav 875/125mg PO BID to complete 7-day course.\\n- Discontinue supplemental oxygen; patient stable at 98% room air.\\n- Resume home Losartan 50mg daily and Ipratropium/Albuterol MDI.\\n- Discharge planning for tomorrow with outpatient pulmonary clinic follow-up in 7 days.`;
      planEl.classList.add('highlight-insert');

          `Dr. Mohammed finalized encounter note with open documentation gaps (Quality Score: ${currentScore}%).`
        );

        showToast('RECORD FINALIZED', `Record Finalized (Clinician Override - Quality Score: ${currentScore}%). Logged in Audit Trail.`, 'info');
      } else {
        // Fully Verified Compliant Flow (>= 90%)
        if (saveBtn) {
          saveBtn.innerHTML = '<span>Record Signed & Verified in EHR ✓</span>';
          saveBtn.className = 'px-5 py-2.5 bg-emerald-800 text-white font-bold text-xs rounded-xl shadow-soft cursor-default transition-all';
        }
        if (badge) {
          badge.innerText = 'Version 1.3 (Signed & Verified)';
          badge.className = 'px-2.5 py-0.5 rounded-full text-xs font-bold badge-emerald';
        }
        if (provTag) {
          provTag.innerText = `Verified & Compliant (${currentScore}%)`;
          provTag.className = 'px-2 py-0.2 rounded bg-emerald-100 text-emerald-800 text-[10px] font-bold';
        }

        appendClinicalAuditLog(
          'Security',
          'Cryptographic Attestation',
          'Dr. Mohammed',
          `Record finalized and digitally stamped (Quality: ${currentScore}%, SHA-256 Hash: sha256-8f9b2a7d4fcbda879e61209b44c82e71fa01) by Dr. Mohammed.`
        );

        showToast('RECORD FINALIZED', `Record Finalized & Verified (Quality Score: ${currentScore}% - Fully Compliant).`, 'success');
      }
    }

    function openModal(id) { 
      if (id === 'auditModal') {
        renderAuditLogs();
      }
      document.getElementById(id).classList.remove('hidden'); 
    }
    function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

    function showToast(title, msg, type = 'info') {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = `p-4 rounded-2xl border shadow-soft-md fade-in flex items-start justify-between gap-3 ${type === 'success' ? 'bg-emerald-900 text-white border-emerald-700' : 'bg-slate-900 text-white border-slate-700'}`;
      toast.innerHTML = `
        <div>
          <div class="font-bold text-xs">${title}</div>
          <div class="text-[11px] opacity-90">${msg}</div>
        </div>
        <button onclick="this.parentElement.remove()" class="opacity-70 hover:opacity-100 text-xs">✕</button>
      `;
      container.appendChild(toast);
      setTimeout(() => { if (toast.parentElement) toast.remove(); }, 4000);
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderAuditLogs();
      resetToRawDraft();
    });
  </script>
</body>
</html>
