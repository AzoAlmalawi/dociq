<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocIQ - Clinical Progress Note & EHR Intelligence Workstation</title>
  
  <!-- Tailwind CSS CDN -->
  

  <script>
    // ==============================================================
    // 1. GLOBAL STATE & BULLETPROOF ROUTER
    // ==============================================================
    window.currentStep = 1;
    window.appScoreState = {
      quality: 68,
      research: 72,
      labAccepted: false,
      acoAccepted: false,
      stewardshipAccepted: false
    };

    window.docPatchState = {
      appliedLabs: false,
      appliedAco: false,
      appliedPlan: false
    };

    window.navigateTo = function(step) {
      const target = Math.min(Math.max(Number(step) || 1, 1), 7);
      window.currentStep = target;

      for (let s = 1; s <= 7; s++) {
        const screenEl = document.getElementById('screen-' + s);
        if (screenEl) {
          if (s === target) {
            screenEl.style.display = 'block';
            screenEl.classList.remove('hidden');
          } else {
            screenEl.style.display = 'none';
            screenEl.classList.add('hidden');
          }
        }

        const sideBtn = document.getElementById('stepBtn-' + s);
        if (sideBtn) {
          const isActive = (s === target);
          sideBtn.className = isActive
            ? 'w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-left transition-all cursor-pointer bg-teal-50 text-teal-800 border border-teal-200 font-bold shadow-soft'
            : 'w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-left transition-all cursor-pointer text-slate-600 hover:bg-slate-50 hover:text-slate-900 border border-transparent';
        }
      }

      if (target === 4 && typeof window.renderStep4Checklist === 'function') {
        window.renderStep4Checklist();
      }
      if (target === 6 && typeof window.updateGlobalScores === 'function') {
        window.updateGlobalScores();
      }
      if (target === 7 && typeof window.updateFinalRecordDisplay === 'function') {
        window.updateFinalRecordDisplay();
      }

      const mainEl = document.querySelector('main');
      if (mainEl) mainEl.scrollTop = 0;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.setStep = window.navigateTo;
    window.setActiveTab = window.navigateTo;
    function navigateTo(step) { window.navigateTo(step); }
    function setStep(step) { window.navigateTo(step); }
    function setActiveTab(step) { window.navigateTo(step); }

    // ==============================================================
    // 2. SCORE & GAUGE SYNCHRONIZATION ENGINE
    // ==============================================================
    window.updateGlobalScores = function() {
      let q = 68;
      let r = 72;

      if (window.docPatchState.appliedLabs) { q += 10; r += 8; }
      if (window.docPatchState.appliedAco) { q += 8; r += 5; }
      if (window.docPatchState.appliedPlan) { q += 6; r += 4; }

      q = Math.min(Math.max(q, 0), 100);
      r = Math.min(Math.max(r, 0), 100);

      window.appScoreState.quality = q;
      window.appScoreState.research = r;

      // Update Step 1 Sarah Card
      const sCardQ = document.getElementById('sarahCardQualityScore');
      if (sCardQ) sCardQ.innerText = Math.round(q) + '%';
      const sCardR = document.getElementById('sarahCardResearchScore');
      if (sCardR) sCardR.innerText = Math.round(r) + '%';

      // Update Step 3 Radial Gauge
      window.updateQualityGauge(q);

      // Update Step 6 Documentation Quality Header Badge
      const qBadge = document.getElementById('step6QualityBadge');
      if (qBadge) {
        if (q < 75) {
          qBadge.innerText = `${Math.round(q)}% - Action Required`;
          qBadge.className = 'text-xs font-semibold px-2.5 py-1 bg-amber-500/20 text-amber-300 border border-amber-500/30 rounded-full transition-all';
        } else if (q >= 75 && q < 90) {
          qBadge.innerText = `${Math.round(q)}% - In Review`;
          qBadge.className = 'text-xs font-semibold px-2.5 py-1 bg-teal-500/20 text-teal-300 border border-teal-500/30 rounded-full transition-all';
        } else {
          qBadge.innerText = `${Math.round(q)}% - Excellent`;
          qBadge.className = 'text-xs font-semibold px-2.5 py-1 bg-emerald-500/20 text-emerald-300 border border-emerald-500/30 rounded-full transition-all';
        }
      }

      // Update Step 6 Research Readiness Header Badge
      const rBadge = document.getElementById('step6ResearchBadge');
      if (rBadge) {
        if (r < 80) {
          rBadge.innerText = `${Math.round(r)}% - Moderate`;
          rBadge.className = 'text-xs font-semibold px-2.5 py-1 bg-amber-500/20 text-amber-300 border border-amber-500/30 rounded-full transition-all';
        } else {
          rBadge.innerText = `${Math.round(r)}% - Very Good`;
          rBadge.className = 'text-xs font-semibold px-2.5 py-1 bg-emerald-400/20 text-emerald-300 border border-emerald-400/30 rounded-full transition-all';
        }
      }
    };

    window.updateQualityGauge = function(score) {
      const targetScore = Math.min(Math.max(Number(score) || 68, 0), 100);
      
      const numEl = document.getElementById('qualityScoreDisplay');
      if (numEl) numEl.innerText = targetScore + '%';

      const arcEl = document.getElementById('qualityGaugeArc');
      if (arcEl) {
        const circumference = 251.32;
        const offset = circumference * (1 - targetScore / 100);
        arcEl.style.strokeDashoffset = offset;

        if (targetScore < 75) {
          arcEl.setAttribute('stroke', '#D97706');
        } else if (targetScore >= 75 && targetScore < 90) {
          arcEl.setAttribute('stroke', '#0D9488');
        } else {
          arcEl.setAttribute('stroke', '#059669');
        }
      }

      const badgeEl = document.getElementById('qualityStatusBadge');
      if (badgeEl) {
        if (targetScore < 75) {
          badgeEl.innerText = `${targetScore}% (Needs Attention)`;
          badgeEl.className = 'text-[11px] font-bold px-2.5 py-1 rounded-full bg-amber-50 text-amber-700 border border-amber-200 transition-all';
        } else if (targetScore >= 75 && targetScore < 90) {
          badgeEl.innerText = `${targetScore}% (In Review / Partial)`;
          badgeEl.className = 'text-[11px] font-bold px-2.5 py-1 rounded-full bg-teal-50 text-teal-700 border border-teal-200 transition-all';
        } else {
          badgeEl.innerText = `${targetScore}% (Excellent / Compliant)`;
          badgeEl.className = 'text-[11px] font-bold px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 transition-all';
        }
      }

      const ptsComp = document.getElementById('ptsCompleteness');
      const ptsPrec = document.getElementById('ptsPrecision');
      const ptsCons = document.getElementById('ptsConsistency');
      const ptsStruc = document.getElementById('ptsStructure');
      const ptsTot = document.getElementById('ptsTotal');

      if (ptsComp && ptsPrec && ptsCons && ptsStruc && ptsTot) {
        if (targetScore <= 68) {
          ptsComp.innerText = '29.09 pts (8/11)';
          ptsPrec.innerText = '13.00 pts';
          ptsCons.innerText = '12.00 pts';
          ptsStruc.innerText = '14.00 pts';
          ptsTot.innerText = '68.00 / 100';
        } else if (targetScore <= 78) {
          ptsComp.innerText = '36.36 pts (10/11)';
          ptsPrec.innerText = '18.00 pts';
          ptsCons.innerText = '14.00 pts';
          ptsStruc.innerText = '18.00 pts';
          ptsTot.innerText = '78.00 / 100';
        } else if (targetScore <= 86) {
          ptsComp.innerText = '36.36 pts (10/11)';
          ptsPrec.innerText = '22.00 pts';
          ptsCons.innerText = '18.00 pts';
          ptsStruc.innerText = '20.00 pts';
          ptsTot.innerText = '86.00 / 100';
        } else {
          ptsComp.innerText = '40.00 pts (11/11)';
          ptsPrec.innerText = '25.00 pts';
          ptsCons.innerText = '20.00 pts';
          ptsStruc.innerText = '20.00 pts';
          ptsTot.innerText = '92.00 / 100';
        }
      }

      const pendingCount = (window.docPatchState.appliedLabs ? 0 : 1) + 
                           (window.docPatchState.appliedAco ? 0 : 1) + 
                           (window.docPatchState.appliedPlan ? 0 : 1);
      
      const gapsBadge = document.getElementById('gapsStatusBadge');
      if (gapsBadge) {
        gapsBadge.innerText = pendingCount === 0 ? 'All Compliant ✓' : `${pendingCount} Actions Pending`;
        gapsBadge.className = pendingCount === 0 
          ? 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-800'
          : 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800';
      }

      const gLabs = document.getElementById('gapItemLabs');
      if (gLabs) {
        gLabs.className = window.docPatchState.appliedLabs
          ? 'p-2.5 rounded-lg border border-emerald-200 bg-emerald-50/50 flex items-center justify-between text-xs'
          : 'p-2.5 rounded-lg border border-amber-200 bg-amber-50/50 flex items-center justify-between text-xs';
        gLabs.innerHTML = window.docPatchState.appliedLabs
          ? '<span class="font-medium text-emerald-900">LOINC Biomarkers Ingestion</span><span class="text-[10px] font-bold text-emerald-700 bg-emerald-100 px-1.5 py-0.5 rounded">Verified ✓</span>'
          : '<span class="font-medium text-amber-900">LOINC Biomarkers Ingestion</span><span class="text-[10px] font-bold text-amber-700 bg-amber-100 px-1.5 py-0.5 rounded">Action Pending</span>';
      }

      const gAco = document.getElementById('gapItemAco');
      if (gAco) {
        gAco.className = window.docPatchState.appliedAco
          ? 'p-2.5 rounded-lg border border-emerald-200 bg-emerald-50/50 flex items-center justify-between text-xs'
          : 'p-2.5 rounded-lg border border-amber-200 bg-amber-50/50 flex items-center justify-between text-xs';
        gAco.innerHTML = window.docPatchState.appliedAco
          ? '<span class="font-medium text-emerald-900">ACO Comorbidity Specificity</span><span class="text-[10px] font-bold text-emerald-700 bg-emerald-100 px-1.5 py-0.5 rounded">Specified ✓</span>'
          : '<span class="font-medium text-amber-900">ACO Comorbidity Specificity</span><span class="text-[10px] font-bold text-amber-700 bg-amber-100 px-1.5 py-0.5 rounded">Action Pending</span>';
      }

      const gPlan = document.getElementById('gapItemPlan');
      if (gPlan) {
        gPlan.className = window.docPatchState.appliedPlan
          ? 'p-2.5 rounded-lg border border-emerald-200 bg-emerald-50/50 flex items-center justify-between text-xs'
          : 'p-2.5 rounded-lg border border-amber-200 bg-amber-50/50 flex items-center justify-between text-xs';
        gPlan.innerHTML = window.docPatchState.appliedPlan
          ? '<span class="font-medium text-emerald-900">7-Day Stewardship Target</span><span class="text-[10px] font-bold text-emerald-700 bg-emerald-100 px-1.5 py-0.5 rounded">Validated ✓</span>'
          : '<span class="font-medium text-amber-900">7-Day Stewardship Target</span><span class="text-[10px] font-bold text-amber-700 bg-amber-100 px-1.5 py-0.5 rounded">Action Pending</span>';
      }
    };

    // ==============================================================
    // 3. STEP 3 ACTIONS & MACROS
    // ==============================================================
    window.insertMacro = function(macro) {
      if (macro === '.vitals') {
        const objText = document.getElementById('soapObjectiveText');
        if (objText && !objText.value.includes('BP 118/74')) {
          objText.value = '• Bedside Vitals (Day 3): BP 118/74 mmHg | HR 78 bpm (regular) | RR 16 | Temp 37.1°C (afebrile) | SpO2 98% room air.\n' + objText.value;
        }
      } else if (macro === '.labs') {
        window.insertCernerLabs();
      } else if (macro === '.curb65') {
        const subj = document.getElementById('soapSubjectiveText');
        if (subj && !subj.value.includes('CURB-65')) {
          subj.value += '\n• Severity Score: CURB-65 = 1 (Age 71, low risk, eligible for step-down).';
        }
      } else if (macro === '.stewardship') {
        window.applyStewardshipPlan();
      }
      window.handleLiveSoapInput();
    };

    window.handleLiveSoapInput = function() {
      const s = (document.getElementById('soapSubjectiveText')?.value || '') + ' ' +
                (document.getElementById('soapObjectiveText')?.value || '') + ' ' +
                (document.getElementById('soapAssessmentText')?.value || '') + ' ' +
                (document.getElementById('soapPlanText')?.value || '');
      
      const words = s.trim() ? s.trim().split(/\s+/).length : 0;
      const chars = s.length;
      const counterEl = document.getElementById('soapStatsCounter');
      if (counterEl) {
        counterEl.innerText = `${words} words • ${chars} chars`;
      }
    };

    window.insertCernerLabs = function() {
      const objText = document.getElementById('soapObjectiveText');
      if (objText) {
        objText.value = `• Bedside Vitals (Day 3): BP 118/74 mmHg | HR 78 bpm (regular) | RR 16 breaths/min | Temp 37.1°C (afebrile) | SpO2 98% on room air.\n• Physical Examination: Alert, oriented x3, in no acute respiratory distress. Light end-inspiratory crackles right lower lobe improving. No wheezing.\n• Ingested Cerner LIS LOINC Biomarkers (Aug 18):\n  - WBC Count: 8.2 x10^9/L (down from 14.1 x10^9/L on admission)\n  - Quantitative CRP: 6.5 mg/L (down from 45.0 mg/L, >85% reduction)\n  - Procalcitonin: 0.11 ng/mL (Normal baseline < 0.25 ng/mL, sepsis excluded)\n  - Urine Antigen: S. pneumoniae positive (confirmatory etiology)`;
      }

      window.docPatchState.appliedLabs = true;
      window.appScoreState.labAccepted = true;
      window.updateGlobalScores();

      const badge = document.getElementById('badgeObjectiveStatus');
      if (badge) {
        badge.innerText = 'LOINC Labs Ingested';
        badge.className = 'text-[10px] font-bold bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded border border-emerald-200';
      }

      const banner = document.getElementById('bannerLabs');
      if (banner) banner.className = 'p-3.5 rounded-xl border border-emerald-300 bg-emerald-50 transition-all flex flex-col sm:flex-row sm:items-center justify-between gap-3';
      const btn = document.getElementById('btnInsertLabs');
      if (btn) {
        btn.innerHTML = '<span>INGESTED ✓ LOINC Biomarkers Linked</span>';
        btn.className = 'px-3.5 py-1.5 bg-emerald-700 text-white font-bold text-xs rounded-lg shadow-2xs transition-all cursor-default shrink-0';
        btn.onclick = null;
      }

      showToast('Cerner LIS Biomarkers Ingested (+10% Quality)', 'success');
      window.handleLiveSoapInput();
    };

    window.clarifyAcoSpecificity = function() {
      const assessText = document.getElementById('soapAssessmentText');
      if (assessText) {
        assessText.value = `1. Severe Community-Acquired Pneumonia (CAP) due to Streptococcus pneumoniae - Resolving (ICD-10 J13 / J18.9).\n2. Asthma-COPD Overlap (ACO) - Explicit Diagnostic Specification (ICD-10 J44.9 / J45.30).\n3. Essential Hypertension - Clinically stable.`;
      }

      window.docPatchState.appliedAco = true;
      window.appScoreState.acoAccepted = true;
      window.updateGlobalScores();

      const badge = document.getElementById('badgeAssessmentStatus');
      if (badge) {
        badge.innerText = 'ACO Specified';
        badge.className = 'text-[10px] font-bold bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded border border-emerald-200';
      }

      const banner = document.getElementById('bannerAco');
      if (banner) banner.className = 'p-3.5 rounded-xl border border-emerald-300 bg-emerald-50 transition-all flex flex-col sm:flex-row sm:items-center justify-between gap-3';
      const btn = document.getElementById('btnClarifyAco');
      if (btn) {
        btn.innerHTML = '<span>OPTIMIZED ✓ Asthma-COPD Overlap (ACO) Specified</span>';
        btn.className = 'px-3.5 py-1.5 bg-emerald-700 text-white font-bold text-xs rounded-lg shadow-2xs transition-all cursor-default shrink-0';
        btn.onclick = null;
      }

      showToast('Diagnosis Specificity Refined to ACO (+8% Quality)', 'success');
      window.handleLiveSoapInput();
    };

    window.applyStewardshipPlan = function() {
      const planText = document.getElementById('soapPlanText');
      if (planText) {
        planText.value = `• Step-down from IV Ceftriaxone to Oral Antimicrobial Therapy: Amoxicillin-Clavulanate (Augmentin) 875/125 mg PO BID.\n• Total Duration of Therapy: Strict 7-day stewardship target course (3 days IV completed + 4 days oral step-down).\n• ATS/IDSA Criteria Met: Afebrile >24h, stable telemetry, normal mentation, and resolving inflammatory biomarkers.\n• Discharge planning initiated with outpatient pulmonary clinic follow-up in 2 weeks.`;
      }

      window.docPatchState.appliedPlan = true;
      window.appScoreState.stewardshipAccepted = true;
      window.updateGlobalScores();

      const badge = document.getElementById('badgePlanStatus');
      if (badge) {
        badge.innerText = '7-Day Plan Set';
        badge.className = 'text-[10px] font-bold bg-emerald-50 text-emerald-700 px-2 py-0.5 rounded border border-emerald-200';
      }

      const banner = document.getElementById('bannerPlan');
      if (banner) banner.className = 'p-3.5 rounded-xl border border-emerald-300 bg-emerald-50 transition-all flex flex-col sm:flex-row sm:items-center justify-between gap-3';
      const btn = document.getElementById('btnApplyPlan');
      if (btn) {
        btn.innerHTML = '<span>VERIFIED ✓ ATS/IDSA Stewardship Target Set</span>';
        btn.className = 'px-3.5 py-1.5 bg-emerald-700 text-white font-bold text-xs rounded-lg shadow-2xs transition-all cursor-default shrink-0';
        btn.onclick = null;
      }

      showToast('ATS/IDSA 7-Day Stewardship Plan Applied (+6% Quality)', 'success');
      window.handleLiveSoapInput();
    };

    window.resetToRawDraft = function() {
      window.docPatchState = {
        appliedLabs: false,
        appliedAco: false,
        appliedPlan: false
      };
      window.appScoreState.labAccepted = false;
      window.appScoreState.acoAccepted = false;
      window.appScoreState.stewardshipAccepted = false;

      const sSubj = document.getElementById('soapSubjectiveText');
      if (sSubj) sSubj.value = `• 71-year-old female admitted 3 days ago with high-grade fever, productive cough with rust-colored sputum, worsening dyspnea on exertion, and sharp right-sided pleuritic chest pain.\n• Past Medical History: Known baseline of mild persistent asthma and essential hypertension.\n• Inpatient Interval (Day 3): Patient reports significant clinical improvement; productive cough is resolving, pleuritic chest pain has subsided, and shortness of breath is markedly improved.\n• Afebrile for >24 hours with no nocturnal chills or diaphoresis.`;
      
      const sObj = document.getElementById('soapObjectiveText');
      if (sObj) sObj.value = `• Bedside Vitals (Day 3): BP 118/74 mmHg | HR 78 bpm (regular) | RR 16 breaths/min | Temp 37.1°C (afebrile) | SpO2 98% on room air.\n• Physical Examination: Alert, oriented x3, in no acute respiratory distress. Chest auscultation demonstrates light end-inspiratory crackles over right middle and lower lung fields; significantly improved compared to admission baseline. No bilateral expiratory wheezes or stridor.`;
      
      const sAssess = document.getElementById('soapAssessmentText');
      if (sAssess) sAssess.value = `1. Community-Acquired Pneumonia (CAP) - Clinical Resolution Trajectory (ICD-10 J18.9).\n2. Essential Hypertension - Stable on home regimen.`;
      
      const sPlan = document.getElementById('soapPlanText');
      if (sPlan) sPlan.value = `• Continue supportive inpatient care and serial vital signs monitoring.\n• Maintain supplemental oxygen PRN to keep SpO2 >= 94%.\n• Awaiting full biomarker telemetry review and antimicrobial stewardship evaluation.`;

      const bObj = document.getElementById('badgeObjectiveStatus');
      if (bObj) { bObj.innerText = 'Pending Labs'; bObj.className = 'text-[10px] font-bold bg-amber-50 text-amber-700 px-2 py-0.5 rounded border border-amber-200'; }
      const bAssess = document.getElementById('badgeAssessmentStatus');
      if (bAssess) { bAssess.innerText = 'Needs Specificity'; bAssess.className = 'text-[10px] font-bold bg-amber-50 text-amber-700 px-2 py-0.5 rounded border border-amber-200'; }
      const bPlan = document.getElementById('badgePlanStatus');
      if (bPlan) { bPlan.innerText = 'Unspecified Duration'; bPlan.className = 'text-[10px] font-bold bg-amber-50 text-amber-700 px-2 py-0.5 rounded border border-amber-200'; }

      const bannerL = document.getElementById('bannerLabs');
      if (bannerL) bannerL.className = 'p-3.5 rounded-xl border border-amber-200 bg-amber-50/70 transition-all flex flex-col sm:flex-row sm:items-center justify-between gap-3';
      const btnL = document.getElementById('btnInsertLabs');
      if (btnL) {
        btnL.innerHTML = '+ Insert Cerner LIS Biomarkers';
        btnL.className = 'px-3.5 py-1.5 bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs rounded-lg shadow-2xs transition-all cursor-pointer shrink-0';
        btnL.onclick = window.insertCernerLabs;
      }

      const bannerA = document.getElementById('bannerAco');
      if (bannerA) bannerA.className = 'p-3.5 rounded-xl border border-amber-200 bg-amber-50/70 transition-all flex flex-col sm:flex-row sm:items-center justify-between gap-3';
      const btnA = document.getElementById('btnClarifyAco');
      if (btnA) {
        btnA.innerHTML = '+ Clarify Comorbidity Specificity';
        btnA.className = 'px-3.5 py-1.5 bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs rounded-lg shadow-2xs transition-all cursor-pointer shrink-0';
        btnA.onclick = window.clarifyAcoSpecificity;
      }

      const bannerP = document.getElementById('bannerPlan');
      if (bannerP) bannerP.className = 'p-3.5 rounded-xl border border-amber-200 bg-amber-50/70 transition-all flex flex-col sm:flex-row sm:items-center justify-between gap-3';
      const btnP = document.getElementById('btnApplyPlan');
      if (btnP) {
        btnP.innerHTML = '+ Apply ATS/IDSA Plan Target';
        btnP.className = 'px-3.5 py-1.5 bg-amber-600 hover:bg-amber-700 text-white font-bold text-xs rounded-lg shadow-2xs transition-all cursor-pointer shrink-0';
        btnP.onclick = window.applyStewardshipPlan;
      }

      window.updateGlobalScores();
      window.handleLiveSoapInput();
      showToast('Reset to Raw Physician Draft (68% Quality)', 'info');
    };

    window.quickFillOptimalNote = function() {
      window.insertCernerLabs();
      window.clarifyAcoSpecificity();
      window.applyStewardshipPlan();
      window.handleLiveSoapInput();
      showToast('Optimal Clinical Protocol Applied (92% Quality / 89% Research)', 'success');
    };

    // ==============================================================
    // 4. STEP 4 CHECKLIST ENGINE
    // ==============================================================
    window.renderStep4Checklist = function() {
      const grid = document.getElementById('checklistDetailedList');
      if (!grid) return;

      const labsOk = !!window.docPatchState.appliedLabs;
      const acoOk = !!window.docPatchState.appliedAco;
      const planOk = !!window.docPatchState.appliedPlan;

      const items = [
        { label: '1. Patient Demographics & Age', ok: true, desc: 'Validated with EHR Registry (Sarah Al-Otaibi, 71y, MRN 882934).' },
        { label: '2. Chief Complaint', ok: true, desc: 'Documented pleuritic chest pain & productive cough.' },
        { label: '3. History of Present Illness (HPI)', ok: true, desc: 'Day 3 interval symptom review & resolution trajectory.' },
        { label: '4. Review of Systems (ROS)', ok: true, desc: 'Negative for chills, fever resolved >24h.' },
        { label: '5. Inpatient Active Medications', ok: true, desc: 'IV Ceftriaxone, Losartan 50mg, Albuterol.' },
        { label: '6. Allergy Assessment', ok: true, desc: 'No Known Drug Allergies (NKDA) confirmed.' },
        { label: '7. Physical Exam & Lung Sounds', ok: true, desc: 'Light end-inspiratory crackles RLL documented.' },
        { label: '8. Bedside Vitals Telemetry', ok: true, desc: 'BP 118/74, Temp 37.1 C, HR 78, SpO2 98% room air.' },
        { label: '9. Inflammatory Biomarkers (WBC / CRP)', ok: labsOk, desc: 'Cerner LIS LOINC WBC 8.2 x10^9/L & CRP 6.5 mg/L.' },
        { label: '10. Comorbidity Specificity (ACO J44.9)', ok: acoOk, desc: 'Asthma-COPD Overlap ICD-10 precision.' },
        { label: '11. Antimicrobial Stewardship Plan', ok: planOk, desc: 'Oral Amoxicillin-Clavulanate 875/125mg BID 7-day target.', span: true }
      ];

      const completedCount = items.filter(i => i.ok).length;
      const pct = Math.round((completedCount / 11) * 100);

      const sumText = document.getElementById('ckSummaryText');
      if (sumText) sumText.innerText = `${completedCount} / 11 Completed (${pct}%)`;
      const sumBar = document.getElementById('ckSummaryBar');
      if (sumBar) {
        sumBar.style.width = `${pct}%`;
        sumBar.className = completedCount === 11 
          ? 'h-full bg-emerald-600 transition-all duration-500 rounded-full' 
          : 'h-full bg-amber-500 transition-all duration-500 rounded-full';
      }

      grid.innerHTML = items.map(item => `
        <div class="bg-white rounded-xl border border-slate-200 p-4 shadow-sm flex items-center justify-between border-l-4 transition-all ${item.span ? 'md:col-span-2' : ''} ${item.ok ? 'border-l-emerald-600' : 'border-l-amber-500 bg-amber-50/20'}">
          <div class="space-y-0.5 pr-3">
            <h4 class="text-xs font-bold text-slate-900">${item.label}</h4>
            <p class="text-[11px] text-slate-500">${item.desc}</p>
          </div>
          <span class="px-2.5 py-1 rounded-full text-[10px] font-bold shrink-0 ${item.ok ? 'bg-emerald-50 text-emerald-700 border border-emerald-200' : 'bg-amber-100 text-amber-800 border border-amber-300'}">
            ${item.ok ? 'Compliant ✓' : 'Action Required'}
          </span>
        </div>
      `).join('');
    };

    // ==============================================================
    // 5. STEP 7 FINALIZE & ATTESTATION ENGINE
    // ==============================================================
    window.updateFinalRecordDisplay = function() {
      const displayEl = document.getElementById('finalNoteContentDisplay');
      if (!displayEl) return;

      const sSubj = document.getElementById('soapSubjectiveText')?.value || '';
      const sObj = document.getElementById('soapObjectiveText')?.value || '';
      const sAssess = document.getElementById('soapAssessmentText')?.value || '';
      const sPlan = document.getElementById('soapPlanText')?.value || '';

      displayEl.innerText = `SUBJECTIVE:\n${sSubj}\n\nOBJECTIVE:\n${sObj}\n\nASSESSMENT:\n${sAssess}\n\nPLAN:\n${sPlan}`;
      
      const qVal = window.appScoreState.quality || 92;
      const qEl = document.getElementById('finalAttestQuality');
      if (qEl) qEl.innerText = `${Math.round(qVal)}% Documentation Quality`;
    };

    window.saveFinalRecord = function() {
      showToast('Document Cryptographically Signed & Saved to EHR ✓', 'success');
      setTimeout(() => {
        alert('EHR Commit Success!\n\nSarah Al-Otaibi progress note signed by Dr. Mohammed.\nFHIR R4 Bundle broadcasted to hospital HIE network.');
      }, 300);
    };

    // Toast Notification System
    window.showToast = function(message, type = 'info') {
      const existing = document.getElementById('appToastBox');
      if (existing) existing.remove();

      const toast = document.createElement('div');
      toast.id = 'appToastBox';
      toast.className = `fixed bottom-6 right-6 z-50 px-4 py-3 rounded-xl shadow-lg font-semibold text-xs text-white transition-all transform duration-300 flex items-center gap-2 ${
        type === 'success' ? 'bg-emerald-700' : type === 'error' ? 'bg-rose-700' : 'bg-slate-900'
      }`;
      toast.innerHTML = `<span>${message}</span>`;
      document.body.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateY(8px)';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    };

    // FHIR R4 Bundle Modal
    window.openFhirModal = function() {
      const existing = document.getElementById('fhirModalBox');
      if (existing) existing.remove();

      const fhirData = {
        resourceType: "Bundle",
        type: "document",
        timestamp: new Date().toISOString(),
        entry: [
          {
            resource: {
              resourceType: "Patient",
              id: "882934",
              name: [{ family: "Al-Otaibi", given: ["Sarah"] }],
              gender: "female",
              birthDate: "1955-03-12"
            }
          },
          {
            resource: {
              resourceType: "Composition",
              status: "final",
              type: { coding: [{ system: "http://loinc.org", code: "11488-4", display: "Consultation Note" }] },
              title: "Inpatient Progress Note & Antimicrobial Stewardship Order"
            }
          },
          {
            resource: {
              resourceType: "Condition",
              code: { coding: [{ system: "http://hl7.org/fhir/sid/icd-10-cm", code: "J13", display: "Pneumonia due to Streptococcus pneumoniae" }] }
            }
          }
        ]
      };

      const modal = document.createElement('div');
      modal.id = 'fhirModalBox';
      modal.className = 'fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4';
      modal.innerHTML = `
        <div class="bg-white rounded-2xl max-w-2xl w-full max-h-[85vh] flex flex-col shadow-2xl border border-slate-200 overflow-hidden">
          <div class="px-6 py-4 bg-slate-900 text-white flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span class="text-xs font-black bg-teal-500 text-slate-950 px-2 py-0.5 rounded">HL7 FHIR R4</span>
              <h3 class="font-bold text-sm">Interoperability Bundle Payload</h3>
            </div>
            <button onclick="document.getElementById('fhirModalBox').remove()" class="text-slate-400 hover:text-white font-bold text-lg cursor-pointer">✕</button>
          </div>
          <div class="p-6 overflow-y-auto font-mono text-xs text-slate-800 bg-slate-50 flex-1">
            <pre class="whitespace-pre-wrap">${JSON.stringify(fhirData, null, 2)}</pre>
          </div>
          <div class="px-6 py-3 bg-white border-t border-slate-200 flex justify-end">
            <button onclick="document.getElementById('fhirModalBox').remove()" class="px-4 py-2 bg-slate-900 text-white text-xs font-bold rounded-xl cursor-pointer">Close Preview</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
    };

    // Auto-initialize on DOM load
    document.addEventListener('DOMContentLoaded', () => {
      window.navigateTo(1);
    });
  </script>
</body>
